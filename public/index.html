<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta viewport content="width=device-width, initial-scale=1.0">
    <title>Personal Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h2>Mi Mood Tracker</h2>
        <form id="moodForm">
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="momento">Momento del día:</label>
                <select id="momento" required>
                    <option value="" disabled selected>Selecciona un momento...</option>
                    <option value="Mañana">Mañana</option>
                    <option value="Mediodía">Mediodía</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noche">Noche</option>
                </select>
            </div>

            <label>Mi estado de ánimo:</label>
            <div class="mood-grid" id="moodOptions">
                <!-- Colores extraídos de la imagen -->
                <div class="mood-btn" data-mood="Feliz" data-color="#FDE047">
                    <div class="color-dot" style="background: #FDE047;"></div>Feliz
                </div>
                <div class="mood-btn" data-mood="Tranquilo/a" data-color="#4ADE80">
                    <div class="color-dot" style="background: #4ADE80;"></div>Tranquilo/a
                </div>
                <div class="mood-btn" data-mood="Emocionado/a" data-color="#7DD3FC">
                    <div class="color-dot" style="background: #7DD3FC;"></div>Emocionado/a
                </div>
                <div class="mood-btn" data-mood="Cansado/a" data-color="#D8B4FE">
                    <div class="color-dot" style="background: #D8B4FE;"></div>Cansado/a
                </div>
                <div class="mood-btn" data-mood="Triste" data-color="#3B82F6">
                    <div class="color-dot" style="background: #3B82F6;"></div>Triste
                </div>
                <div class="mood-btn" data-mood="Enojado/a" data-color="#EF4444">
                    <div class="color-dot" style="background: #EF4444;"></div>Enojado/a
                </div>
                <div class="mood-btn" data-mood="Preocupado/a" data-color="#F97316">
                    <div class="color-dot" style="background: #F97316;"></div>Preocupado/a
                </div>
                <div class="mood-btn" data-mood="Asustado/a" data-color="#9CA3AF">
                    <div class="color-dot" style="background: #9CA3AF;"></div>Asustado/a
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar Registro</button>
        </form>
    </div>

    <script src="frontend.js"></script>
</body>
