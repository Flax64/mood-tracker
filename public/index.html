<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="Mood Tracker">
    <meta property="og:url" content="http://3.149.248.153:3000/">
    <meta property="og:type" content="website">
</head>

<body>
    <div>

    </div>
    <div class="card">
        <h2>Mi Mood Tracker</h2>
        <form id="moodForm">
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="momento">Momento del día:</label>
                <select id="momento" required>
                    <option value="" disabled selected>Selecciona un momento...</option>
                    <option value="Morning">Mañana</option>
                    <option value="Noon">Mediodía</option>
                    <option value="Afternoon">Tarde</option>
                    <option value="Night">Noche</option>
                </select>
            </div>

            <label>Mi estado de ánimo:</label>
            <div class="mood-grid" id="moodOptions">
                <!-- Colores extraídos de la imagen -->
                <div class="mood-btn" data-mood="Happy" data-color="#FDE047">
                    <div class="color-dot" style="background: #FDE047;"></div>Feliz
                </div>
                <div class="mood-btn" data-mood="Calm" data-color="#4ADE80">
                    <div class="color-dot" style="background: #4ADE80;"></div>Tranquilo
                </div>
                <div class="mood-btn" data-mood="Excited" data-color="#7DD3FC">
                    <div class="color-dot" style="background: #7DD3FC;"></div>Emocionado
                </div>
                <div class="mood-btn" data-mood="Tired" data-color="#D8B4FE">
                    <div class="color-dot" style="background: #D8B4FE;"></div>Cansado
                </div>
                <div class="mood-btn" data-mood="Sad" data-color="#3B82F6">
                    <div class="color-dot" style="background: #3B82F6;"></div>Triste
                </div>
                <div class="mood-btn" data-mood="Angry" data-color="#EF4444">
                    <div class="color-dot" style="background: #EF4444;"></div>Enojado
                </div>
                <div class="mood-btn" data-mood="Worried" data-color="#F97316">
                    <div class="color-dot" style="background: #F97316;"></div>Preocupado
                </div>
                <div class="mood-btn" data-mood="Scared" data-color="#9CA3AF">
                    <div class="color-dot" style="background: #9CA3AF;"></div>Asustado
                </div>
                <div class="mood-btn" data-mood="Focused" data-color="#14B8A6">
                    <div class="color-dot" style="background-color: #14B8A6;"></div>Enfocado
                </div>
                <div class="mood-btn" data-mood="Motivated" data-color="#F59E0B">
                    <div class="color-dot" style="background-color: #F59E0B;"></div>Motivado
                </div>
                <div class="mood-btn" data-mood="Stressed" data-color="#991B1B">
                    <div class="color-dot" style="background-color: #991B1B;"></div>Estresado
                </div>
                <div class="mood-btn" data-mood="Frustrated" data-color="#D946EF">
                    <div class="color-dot" style="background-color: #D946EF;"></div>Frustrado
                </div>
                <div class="mood-btn" data-mood="Bored" data-color="#D1D5DB">
                    <div class="color-dot" style="background-color: #D1D5DB;"></div>Aburrido
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar Registro</button>
            <a href="dashboard.html" class="btn-view">Ver Registro Semanal</a>
        </form>
    </div>

    <script src="frontend.js"></script>
</body>
