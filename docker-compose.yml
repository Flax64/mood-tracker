services:
  db:
    image: mysql:8.0
    container_name: mood_db
    restart: always
    mem_limit: 1024m
    # Optimización para Ubuntu Server (8 GB RAM + 1 TB almacenamiento, sin binlogs ni performance_schema)
    command:
      - --performance-schema=OFF
      - --mysqlx=0
      - --skip-log-bin
      - --innodb-buffer-pool-size=256M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
      - --table-open-cache=256
      - --table-definition-cache=400
      - --key-buffer-size=8M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --thread-cache-size=8
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ:-America/Monterrey}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Ejecuta el script SQL al crear el contenedor por primera vez
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  app:
    build: .
    container_name: mood_app
    restart: always
    mem_limit: 1024m
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Journal personal cifrado con contraseña (100% local, nunca en Drive ni Git)
      - ./data/journal:/app/journal-data
      # Caché/espejo local del Cuaderno de Idiomas (sincronizado con Google Drive en la nube)
      - ./english-notes:/app/english-notes
      # Carpeta opcional para cookies de yt-dlp si YouTube llegara a pedir sesión
      - ./data/ytdlp:/app/ytdlp-config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT:-3000}
      - TZ=${TZ:-America/Monterrey}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SERVER_AUTONOMOUS_NOTES=${SERVER_AUTONOMOUS_NOTES:-true}
      - JOURNAL_LOCAL_PATH=${JOURNAL_LOCAL_PATH:-/app/journal-data/Diario.docx}
      - ENGLISH_WORD_FILE_PATH=${ENGLISH_WORD_FILE_PATH:-/app/english-notes/English_Learning_Notebook.docx}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - WORD_PASSWORD=${WORD_PASSWORD:-}
      - JOURNAL_SECRET_KEY=${JOURNAL_SECRET_KEY:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-gdrive}
      - RCLONE_BACKUP_DIR=${RCLONE_BACKUP_DIR:-RespaldosApp}
      - STUDY_RCLONE_REMOTE=${STUDY_RCLONE_REMOTE:-}
      - STUDY_RCLONE_DIR=${STUDY_RCLONE_DIR:-NotasIdiomas}
      - RCLONE_CONF_B64=${RCLONE_CONF_B64:-}
      - STUDY_RCLONE_CONF_B64=${STUDY_RCLONE_CONF_B64:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - YT_DLP_PATH=${YT_DLP_PATH:-}
      - YTDLP_COOKIES_PATH=${YTDLP_COOKIES_PATH:-}
      - YTM_INNERTUBE=${YTM_INNERTUBE:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    container_name: mood_proxy
    restart: always
    mem_limit: 64m
    ports:
      # Puertos alternos por defecto para no chocar con `tailscale serve` en :443
      - "127.0.0.1:${PROXY_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${PROXY_HTTPS_PORT:-8443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - PORT=${PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config: