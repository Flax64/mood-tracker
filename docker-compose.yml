services:
  db:
    image: mysql:8.0
    container_name: mood_db
    restart: always
    mem_limit: 512m
    # Optimización para t3.micro (1 GB RAM + 1 GB Swap) y menor uso de disco (sin binlogs ni performance_schema)
    command:
      - --performance-schema=OFF
      - --mysqlx=0
      - --skip-log-bin
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --max-connections=25
      - --table-open-cache=128
      - --table-definition-cache=256
      - --key-buffer-size=4M
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --thread-cache-size=4
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ:-America/Monterrey}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Ejecuta el script SQL al crear el contenedor por primera vez
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  app:
    build: .
    container_name: mood_app
    restart: unless-stopped
    mem_limit: 220m
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT:-3000}
      - TZ=${TZ:-America/Monterrey}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-flavio.flax1234@gmail.com}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - WORD_PASSWORD=${WORD_PASSWORD:-}
      - JOURNAL_SECRET_KEY=${JOURNAL_SECRET_KEY:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: