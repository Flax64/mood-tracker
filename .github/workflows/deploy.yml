name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar y migrar en AWS EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          SECRET_DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          SECRET_DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
          SECRET_DB_PASS: ${{ secrets.DB_PASS }}
          SECRET_DB_NAME: ${{ secrets.DB_NAME || vars.DB_NAME }}
          SECRET_PORT: ${{ vars.PORT || secrets.PORT }}
          SECRET_TZ: ${{ vars.TZ || secrets.TZ }}
          SECRET_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}
          SECRET_ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SECRET_SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SECRET_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SECRET_APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL }}
          SEAL_ENV_AFTER_DEPLOY: ${{ vars.SEAL_ENV_AFTER_DEPLOY || secrets.SEAL_ENV_AFTER_DEPLOY }}
          SECRET_RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || secrets.RCLONE_REMOTE }}
          SECRET_RCLONE_BACKUP_DIR: ${{ vars.RCLONE_BACKUP_DIR || secrets.RCLONE_BACKUP_DIR }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        with:
          host: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPO,DEPLOY_EC2_HOST,SECRET_DB_HOST,SECRET_DB_USER,SECRET_DB_PASS,SECRET_DB_NAME,SECRET_PORT,SECRET_TZ,SECRET_ADMIN_EMAIL,SECRET_ADMIN_SECRET,SECRET_SMTP_USER,SECRET_SMTP_PASS,SECRET_APP_BASE_URL,SEAL_ENV_AFTER_DEPLOY,SECRET_RCLONE_REMOTE,SECRET_RCLONE_BACKUP_DIR,RCLONE_CONF_B64
          script: |
            set -euo pipefail

            # 1. Instalar dependencias base si es una instancia nueva
            if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v rclone >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y git curl ca-certificates rclone unzip
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y git curl unzip
                if ! command -v rclone >/dev/null 2>&1; then
                  curl -fsSL https://rclone.org/install.sh | sudo bash
                fi
              fi
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "Instalando Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER" || true
              sudo systemctl enable --now docker || true
            fi

            DOCKER_CMD="docker"
            if ! docker info >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker"
            fi

            # 2. Clonar o actualizar el repositorio de forma limpia
            mkdir -p "$HOME/projects"
            cd "$HOME/projects"
            if [ ! -d "mood-tracker/.git" ]; then
              git clone "https://github.com/${GITHUB_REPO}.git" mood-tracker
            fi
            cd "$HOME/projects/mood-tracker"
            git fetch origin main
            git reset --hard origin/main

            # 3. Crear o actualizar .env conservando valores previos si algún secret opcional no está definido
            if [ -f ".env" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                line="${line%$'\r'}"
                [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
                k="${line%%=*}"; v="${line#*=}"; k="${k//[[:space:]]/}"
                [[ "$k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
                if [[ "$v" == \"*\" && "$v" == *\" ]] || [[ "$v" == \'*\' && "$v" == *\' ]]; then
                  v="${v:1:${#v}-2}"
                fi
                export "OLD_$k=$v"
              done < .env
            fi

            FINAL_DB_PASS="${SECRET_DB_PASS:-${OLD_DB_PASS:-}}"
            if [ -z "$FINAL_DB_PASS" ]; then
              echo "ERROR: No existe .env en la instancia ni el secret DB_PASS en GitHub." >&2
              exit 1
            fi

            FINAL_DB_HOST="${SECRET_DB_HOST:-${OLD_DB_HOST:-db}}"
            FINAL_DB_USER="${SECRET_DB_USER:-${OLD_DB_USER:-root}}"
            FINAL_DB_NAME="${SECRET_DB_NAME:-${OLD_DB_NAME:-MoodTrackerLocal}}"
            FINAL_PORT="${SECRET_PORT:-${OLD_PORT:-3000}}"
            FINAL_TZ="${SECRET_TZ:-${OLD_TZ:-America/Monterrey}}"
            FINAL_ADMIN_EMAIL="${SECRET_ADMIN_EMAIL:-${OLD_ADMIN_EMAIL:-flavio.flax1234@gmail.com}}"
            FINAL_ADMIN_SECRET="${SECRET_ADMIN_SECRET:-${OLD_ADMIN_SECRET:-}}"
            FINAL_SMTP_USER="${SECRET_SMTP_USER:-${OLD_SMTP_USER:-$FINAL_ADMIN_EMAIL}}"
            FINAL_SMTP_PASS="${SECRET_SMTP_PASS:-${OLD_SMTP_PASS:-}}"
            FINAL_APP_BASE_URL="${SECRET_APP_BASE_URL:-http://${DEPLOY_EC2_HOST}:${FINAL_PORT}}"
            FINAL_RCLONE_REMOTE="${SECRET_RCLONE_REMOTE:-${OLD_RCLONE_REMOTE:-gdrive}}"
            FINAL_RCLONE_BACKUP_DIR="${SECRET_RCLONE_BACKUP_DIR:-${OLD_RCLONE_BACKUP_DIR:-RespaldosApp}}"

            {
              printf 'DB_HOST=%s\n' "$FINAL_DB_HOST"
              printf 'DB_USER=%s\n' "$FINAL_DB_USER"
              printf 'DB_PASS=%s\n' "$FINAL_DB_PASS"
              printf 'DB_NAME=%s\n' "$FINAL_DB_NAME"
              printf 'PORT=%s\n' "$FINAL_PORT"
              printf 'TZ=%s\n' "$FINAL_TZ"
              printf 'ADMIN_EMAIL=%s\n' "$FINAL_ADMIN_EMAIL"
              printf 'ADMIN_SECRET=%s\n' "$FINAL_ADMIN_SECRET"
              printf 'SMTP_USER=%s\n' "$FINAL_SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$FINAL_SMTP_PASS"
              printf 'APP_BASE_URL=%s\n' "$FINAL_APP_BASE_URL"
              printf 'RCLONE_REMOTE=%s\n' "$FINAL_RCLONE_REMOTE"
              printf 'RCLONE_BACKUP_DIR=%s\n' "$FINAL_RCLONE_BACKUP_DIR"
            } > .env
            chmod 600 .env

            # 4. Configurar rclone automáticamente si se proporcionó RCLONE_CONF_B64
            if [ -n "${RCLONE_CONF_B64:-}" ]; then
              mkdir -p "$HOME/.config/rclone"
              printf '%s' "$RCLONE_CONF_B64" | tr -d ' \n\r' | base64 -d > "$HOME/.config/rclone/rclone.conf"
              chmod 600 "$HOME/.config/rclone/rclone.conf"
            fi

            chmod +x scripts/backup.sh scripts/restore.sh scripts/env-vault.sh

            # 5. Levantar o actualizar los contenedores Docker
            $DOCKER_CMD compose up -d --build

            # 6. Si es una instancia nueva / BD vacía, restaurar automáticamente el último backup de Google Drive
            ./scripts/restore.sh --if-empty

            # 7. Limpiar imágenes huérfanas y caché viejo de Docker para no llenar el disco de la t3.micro
            $DOCKER_CMD image prune -f >/dev/null 2>&1 || true
            $DOCKER_CMD builder prune -f --filter "until=24h" >/dev/null 2>&1 || true

            # 8. Registrar respaldo automático diario a Google Drive (3:00 AM)
            mkdir -p "$HOME/projects/respaldos"
            CRON_JOB="0 3 * * * $HOME/projects/mood-tracker/scripts/backup.sh >> $HOME/projects/respaldos/backup.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "scripts/backup.sh" || true; echo "$CRON_JOB") | crontab -

            # 9. Opcional: eliminar .env plano tras desplegar si SEAL_ENV_AFTER_DEPLOY=true
            if [ "${SEAL_ENV_AFTER_DEPLOY:-false}" = "true" ]; then
              shred -u .env 2>/dev/null || rm -f .env
              echo "Archivo .env en texto plano eliminado tras el despliegue (SEAL_ENV_AFTER_DEPLOY=true)."
            fi
