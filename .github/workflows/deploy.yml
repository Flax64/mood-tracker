name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar y migrar en AWS EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          SECRET_DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          SECRET_DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
          SECRET_DB_PASS: ${{ secrets.DB_PASS }}
          SECRET_DB_NAME: ${{ secrets.DB_NAME || vars.DB_NAME }}
          SECRET_PORT: ${{ vars.PORT || secrets.PORT }}
          SECRET_TZ: ${{ vars.TZ || secrets.TZ }}
          SECRET_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}
          SECRET_ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SECRET_WORD_PASSWORD: ${{ secrets.WORD_PASSWORD }}
          SECRET_JOURNAL_SECRET_KEY: ${{ secrets.JOURNAL_SECRET_KEY }}
          SECRET_SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SECRET_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SECRET_APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL }}
          SEAL_ENV_AFTER_DEPLOY: ${{ vars.SEAL_ENV_AFTER_DEPLOY || secrets.SEAL_ENV_AFTER_DEPLOY }}
          BACKUP_CRON_SCHEDULE: ${{ vars.BACKUP_CRON_SCHEDULE || secrets.BACKUP_CRON_SCHEDULE }}
          SECRET_RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || secrets.RCLONE_REMOTE }}
          SECRET_RCLONE_BACKUP_DIR: ${{ vars.RCLONE_BACKUP_DIR || secrets.RCLONE_BACKUP_DIR }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_YT_DLP_PATH: ${{ vars.YT_DLP_PATH || secrets.YT_DLP_PATH }}
        with:
          host: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPO,DEPLOY_EC2_HOST,SECRET_DB_HOST,SECRET_DB_USER,SECRET_DB_PASS,SECRET_DB_NAME,SECRET_PORT,SECRET_TZ,SECRET_ADMIN_EMAIL,SECRET_ADMIN_SECRET,SECRET_WORD_PASSWORD,SECRET_JOURNAL_SECRET_KEY,SECRET_SMTP_USER,SECRET_SMTP_PASS,SECRET_APP_BASE_URL,SEAL_ENV_AFTER_DEPLOY,BACKUP_CRON_SCHEDULE,SECRET_RCLONE_REMOTE,SECRET_RCLONE_BACKUP_DIR,RCLONE_CONF_B64,SECRET_GEMINI_API_KEY,SECRET_YT_DLP_PATH
          script: |
            set -euo pipefail

            DEPLOY_ENV_FILE=""
            cleanup_deploy_env() {
              if [ -n "${DEPLOY_ENV_FILE:-}" ] && [ -f "$DEPLOY_ENV_FILE" ]; then
                shred -u -z -n 1 "$DEPLOY_ENV_FILE" 2>/dev/null || rm -f "$DEPLOY_ENV_FILE"
                DEPLOY_ENV_FILE=""
              fi
            }
            trap cleanup_deploy_env EXIT INT TERM

            # 0. Activar memoria Swap primero (critico al migrar o desplegar en instancias con poca RAM como EC2 1 GB)
            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            fi
            if ! swapon --show=NAME --noheadings 2>/dev/null | grep -q .; then
              echo "💾 Activando memoria Swap (1 GB) como primer paso antes de preparar dependencias..."
              if [ ! -s /swapfile ]; then
                $SUDO fallocate -l 1G /swapfile 2>/dev/null || $SUDO dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
              fi
              $SUDO chmod 600 /swapfile
              $SUDO mkswap /swapfile >/dev/null 2>&1 || true
              $SUDO swapon /swapfile || true
              if [ -f /etc/fstab ] && ! grep -qE '^/swapfile[[:space:]]' /etc/fstab; then
                echo '/swapfile none swap sw 0 0' | $SUDO tee -a /etc/fstab >/dev/null
              fi
            else
              echo "💾 Memoria Swap ya activa en la instancia."
            fi
            free -h | grep -iE 'mem|swap' || true

            # 1. Instalar dependencias base (incluyendo cron y openssl) si es una instancia nueva
            if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v rclone >/dev/null 2>&1 || ! command -v crontab >/dev/null 2>&1 || ! command -v openssl >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y git curl ca-certificates rclone unzip cron openssl
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y git curl unzip cronie openssl
                if ! command -v rclone >/dev/null 2>&1; then
                  curl -fsSL https://rclone.org/install.sh | sudo bash
                fi
              fi
            fi

            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl enable --now cron 2>/dev/null || sudo systemctl enable --now crond 2>/dev/null || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "Instalando Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER" || true
              sudo systemctl enable --now docker || true
            fi

            DOCKER_CMD="docker"
            if ! docker info >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker"
            fi
            if ! $DOCKER_CMD compose version >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y && sudo apt-get install -y docker-compose-plugin || true
              fi
            fi

            # 2. Clonar o actualizar el repositorio de forma limpia
            mkdir -p "$HOME/projects"
            cd "$HOME/projects"
            if [ ! -d "mood-tracker/.git" ]; then
              git clone "https://github.com/${GITHUB_REPO}.git" mood-tracker
            fi
            cd "$HOME/projects/mood-tracker"
            git remote set-url origin "https://github.com/${GITHUB_REPO}.git"
            git fetch origin main
            git reset --hard origin/main

            # 3. Preparar entorno de despliegue solo en RAM (/dev/shm) desde GitHub Secrets/Variables
            if [ -f ".env" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                line="${line%$'\r'}"
                [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
                k="${line%%=*}"; v="${line#*=}"; k="${k//[[:space:]]/}"
                [[ "$k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
                if [[ "$v" == \"*\" && "$v" == *\" ]] || [[ "$v" == \'*\' && "$v" == *\' ]]; then
                  v="${v:1:${#v}-2}"
                fi
                export "OLD_$k=$v"
              done < .env
            fi

            FINAL_DB_PASS="${SECRET_DB_PASS:-${OLD_DB_PASS:-}}"
            if [ -z "$FINAL_DB_PASS" ]; then
              echo "ERROR: No existe el secret DB_PASS en GitHub ni .env previo en la instancia." >&2
              exit 1
            fi

            FINAL_DB_HOST="${SECRET_DB_HOST:-${OLD_DB_HOST:-db}}"
            FINAL_DB_USER="${SECRET_DB_USER:-${OLD_DB_USER:-root}}"
            FINAL_DB_NAME="${SECRET_DB_NAME:-${OLD_DB_NAME:-MoodTrackerLocal}}"
            FINAL_PORT="${SECRET_PORT:-${OLD_PORT:-3000}}"
            FINAL_TZ="${SECRET_TZ:-${OLD_TZ:-America/Monterrey}}"
            FINAL_ADMIN_EMAIL="${SECRET_ADMIN_EMAIL:-${OLD_ADMIN_EMAIL:-flavio.flax1234@gmail.com}}"
            FINAL_ADMIN_SECRET="${SECRET_ADMIN_SECRET:-${OLD_ADMIN_SECRET:-}}"
            FINAL_WORD_PASSWORD="${SECRET_WORD_PASSWORD:-${OLD_WORD_PASSWORD:-}}"
            FINAL_JOURNAL_SECRET_KEY="${SECRET_JOURNAL_SECRET_KEY:-${OLD_JOURNAL_SECRET_KEY:-}}"
            FINAL_SMTP_USER="${SECRET_SMTP_USER:-${OLD_SMTP_USER:-$FINAL_ADMIN_EMAIL}}"
            FINAL_SMTP_PASS="${SECRET_SMTP_PASS:-${OLD_SMTP_PASS:-}}"
            FINAL_APP_BASE_URL="${SECRET_APP_BASE_URL:-http://${DEPLOY_EC2_HOST}:${FINAL_PORT}}"
            FINAL_RCLONE_REMOTE="${SECRET_RCLONE_REMOTE:-${OLD_RCLONE_REMOTE:-gdrive}}"
            FINAL_RCLONE_BACKUP_DIR="${SECRET_RCLONE_BACKUP_DIR:-${OLD_RCLONE_BACKUP_DIR:-RespaldosApp}}"
            FINAL_GEMINI_API_KEY="${SECRET_GEMINI_API_KEY:-${OLD_GEMINI_API_KEY:-}}"
            FINAL_YT_DLP_PATH="${SECRET_YT_DLP_PATH:-${OLD_YT_DLP_PATH:-}}"

            ENV_TMP_DIR="/dev/shm"
            if [ ! -d "$ENV_TMP_DIR" ] || [ ! -w "$ENV_TMP_DIR" ]; then
              ENV_TMP_DIR="${TMPDIR:-/tmp}"
            fi
            DEPLOY_ENV_FILE="$(umask 077 && mktemp "$ENV_TMP_DIR/.mood_deploy_env.XXXXXX")"
            chmod 600 "$DEPLOY_ENV_FILE"

            {
              printf 'DB_HOST=%s\n' "$FINAL_DB_HOST"
              printf 'DB_USER=%s\n' "$FINAL_DB_USER"
              printf 'DB_PASS=%s\n' "$FINAL_DB_PASS"
              printf 'DB_NAME=%s\n' "$FINAL_DB_NAME"
              printf 'PORT=%s\n' "$FINAL_PORT"
              printf 'TZ=%s\n' "$FINAL_TZ"
              printf 'ADMIN_EMAIL=%s\n' "$FINAL_ADMIN_EMAIL"
              printf 'ADMIN_SECRET=%s\n' "$FINAL_ADMIN_SECRET"
              printf 'WORD_PASSWORD=%s\n' "$FINAL_WORD_PASSWORD"
              printf 'JOURNAL_SECRET_KEY=%s\n' "$FINAL_JOURNAL_SECRET_KEY"
              printf 'SMTP_USER=%s\n' "$FINAL_SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$FINAL_SMTP_PASS"
              printf 'APP_BASE_URL=%s\n' "$FINAL_APP_BASE_URL"
              printf 'RCLONE_REMOTE=%s\n' "$FINAL_RCLONE_REMOTE"
              printf 'RCLONE_BACKUP_DIR=%s\n' "$FINAL_RCLONE_BACKUP_DIR"
              printf 'GEMINI_API_KEY=%s\n' "$FINAL_GEMINI_API_KEY"
              printf 'YT_DLP_PATH=%s\n' "$FINAL_YT_DLP_PATH"
            } > "$DEPLOY_ENV_FILE"

            # 4. Configurar rclone automáticamente si se proporcionó RCLONE_CONF_B64
            if [ -n "${RCLONE_CONF_B64:-}" ]; then
              mkdir -p "$HOME/.config/rclone"
              printf '%s' "$RCLONE_CONF_B64" | tr -d ' \n\r' | base64 -d > "$HOME/.config/rclone/rclone.conf"
              chmod 600 "$HOME/.config/rclone/rclone.conf"
            fi
            unset RCLONE_CONF_B64

            chmod +x scripts/backup.sh scripts/restore.sh scripts/env-vault.sh

            # 5. Levantar o actualizar los contenedores Docker leyendo el entorno desde RAM
            $DOCKER_CMD compose --env-file "$DEPLOY_ENV_FILE" up -d --build

            # 6. Si es una instancia nueva / BD vacía, restaurar automáticamente el último backup de Google Drive
            ENV_FILE_OVERRIDE="$DEPLOY_ENV_FILE" ./scripts/restore.sh --if-empty

            # 7. Limpiar imágenes huérfanas y caché viejo de Docker para no llenar el disco de la t3.micro
            $DOCKER_CMD image prune -f >/dev/null 2>&1 || true
            $DOCKER_CMD builder prune -f --filter "until=24h" >/dev/null 2>&1 || true

            # 8. Ajustar zona horaria del host y registrar respaldo automático diario (3:30 AM hora TZ)
            if command -v timedatectl >/dev/null 2>&1 && [ -n "${FINAL_TZ:-}" ]; then
              CURRENT_SYS_TZ="$(timedatectl show -p Timezone --value 2>/dev/null || true)"
              if [ "$CURRENT_SYS_TZ" != "$FINAL_TZ" ]; then
                if sudo timedatectl set-timezone "$FINAL_TZ" 2>/dev/null; then
                  if command -v systemctl >/dev/null 2>&1; then
                    sudo systemctl restart cron 2>/dev/null || sudo systemctl restart crond 2>/dev/null || true
                  fi
                fi
              fi
            fi

            mkdir -p "$HOME/projects/respaldos"
            {
              printf 'DB_CONTAINER=%s\n' 'mood_db'
              printf 'RCLONE_REMOTE=%s\n' "$FINAL_RCLONE_REMOTE"
              printf 'RCLONE_BACKUP_DIR=%s\n' "$FINAL_RCLONE_BACKUP_DIR"
              printf 'BACKUP_LOCAL_DIR=%s\n' "$HOME/projects/respaldos"
            } > "$HOME/projects/respaldos/.backup.meta"
            chmod 600 "$HOME/projects/respaldos/.backup.meta"

            FINAL_CRON_SCHEDULE="${BACKUP_CRON_SCHEDULE:-30 3 * * *}"
            CRON_JOB="${FINAL_CRON_SCHEDULE} $HOME/projects/mood-tracker/scripts/backup.sh >> $HOME/projects/respaldos/backup.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "scripts/backup.sh" || true; printf '%s\n' "$CRON_JOB") | crontab -

            # 9. Garantizar cero .env en disco por defecto (salvo que SEAL_ENV_AFTER_DEPLOY=false)
            if [ "${SEAL_ENV_AFTER_DEPLOY:-true}" = "false" ]; then
              cp "$DEPLOY_ENV_FILE" .env
              chmod 600 .env
              echo "Archivo .env conservado en disco (SEAL_ENV_AFTER_DEPLOY=false)."
            else
              if [ -f ".env" ]; then
                shred -u -z -n 1 .env 2>/dev/null || rm -f .env
              fi
              echo "Despliegue completado sin archivo .env en disco (gestionado 100% por GitHub Secrets/Variables)."
            fi
            cleanup_deploy_env
